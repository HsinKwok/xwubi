name = "xwubi"
main = "src/worker/index.ts"
compatibility_date = "2025-09-01"

# 让 Worker 尽量在靠近 D1 主库的节点执行，降低数据库往返延迟；
# 静态资源仍由 Cloudflare 边缘直接分发，不受影响。
[placement]
mode = "smart"

# 静态资源（Vite 构建产物）交给 Cloudflare 边缘直接分发；
# 未命中静态文件的请求才会进入 Worker（API 与 SPA 路由回退）。
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "xwubi"
database_id = "1be7ad9f-9df9-4d7f-a5d8-080c69bb664e"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "cddc92f8d2024f8497f8accea91e6aea"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "xwubi-media"

[vars]
ENVIRONMENT = "development"
SITE_ORIGIN = "http://localhost:8787"
# 发件人地址（需在 Resend 完成域名验证）；留空时邮件只打印到控制台，便于本地联调
MAIL_FROM = ""
# 生产环境通过 `wrangler secret put RESEND_API_KEY` 配置，不要写在此文件

